name: chu

# Airflow : LocalExecutor, les tâches (dont Spark en mode local) tournent dans le conteneur du scheduler.
# dags/ et pipelines/ sont montés en lecture seule : modifier le code ne demande pas de reconstruire l'image.
x-airflow-commun: &airflow-commun
  build: ./airflow
  image: chu-airflow:local
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?renseigner AIRFLOW_DB_PASSWORD dans .env}@airflow-db/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?renseigner AIRFLOW_SECRET_KEY dans .env}
    PYTHONPATH: /opt/airflow
    PYTHONDONTWRITEBYTECODE: "1"
    # Lac : MinIO via S3A (pipelines/common/session_spark.py) ; les JAR sont déjà dans l'image
    LAKE_ROOT: s3a://
    DATA_DIR: /opt/data
    DELTA_JARS_INCLUS: "1"
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:?renseigner MINIO_ROOT_USER dans .env}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?renseigner MINIO_ROOT_PASSWORD dans .env}
  volumes:
    - ../dags:/opt/airflow/dags:ro
    - ../pipelines:/opt/airflow/pipelines:ro
    - ../data:/opt/data:ro
    - airflow_logs:/opt/airflow/logs
  networks:
    - chu

services:
  minio:
    build: ./minio
    image: chu-minio:local
    container_name: chu-minio
    command: ["minio", "server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?renseigner MINIO_ROOT_USER dans .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?renseigner MINIO_ROOT_PASSWORD dans .env}
    # API S3 et console : joignables depuis ce poste uniquement
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - chu
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: chu-minio:local
    container_name: chu-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?renseigner MINIO_ROOT_USER dans .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?renseigner MINIO_ROOT_PASSWORD dans .env}
    volumes:
      - ./minio/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    networks:
      - chu
    restart: "no"

  airflow-db:
    image: postgres:16-alpine
    container_name: chu-airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?renseigner AIRFLOW_DB_PASSWORD dans .env}
      POSTGRES_DB: airflow
    volumes:
      - airflow_db:/var/lib/postgresql/data
    networks:
      - chu
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow", "-d", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    <<: *airflow-commun
    container_name: chu-airflow-init
    command: version
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:?renseigner AIRFLOW_ADMIN_USER dans .env}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?renseigner AIRFLOW_ADMIN_PASSWORD dans .env}
    depends_on:
      airflow-db:
        condition: service_healthy
    restart: "no"

  airflow-webserver:
    <<: *airflow-commun
    container_name: chu-airflow-webserver
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-commun
    container_name: chu-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  ftp:
    build: ./ftp
    image: chu-ftp:local
    container_name: chu-ftp
    environment:
      FTP_USER: ${FTP_USER:?renseigner FTP_USER dans .env}
      FTP_PASSWORD: ${FTP_PASSWORD:?renseigner FTP_PASSWORD dans .env}
      FTP_DEPOT_USER: ${FTP_DEPOT_USER:?renseigner FTP_DEPOT_USER dans .env}
      FTP_DEPOT_PASSWORD: ${FTP_DEPOT_PASSWORD:?renseigner FTP_DEPOT_PASSWORD dans .env}
    ports:
      - "2121:21"
      - "30000-30009:30000-30009"
    volumes:
      - ftp_depot:/srv/ftp
    networks:
      - chu
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 21), 2)"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  ftp_depot:
  minio_data:
  airflow_db:
  airflow_logs:

networks:
  chu:
    name: chu
